<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
<title id="title">Motion Tracking Studio workflow</title><desc id="desc">Import video, explicitly choose a target or fixed anchor, prepare its path, style a HUD, review and export using the same renderer. Codex assisted development; no generative model runs in this pipeline.</desc>
